# Tailscale-only SSH for user phil.
#
# Tailscale's own SSH server (tailscale set --ssh) claims TCP/22 on the
# Tailscale IP for traffic arriving from tailnet peers, so OpenSSH listens
# on TCP/2222 instead. It is bound to the Tailscale IP only (see
# 21-tailscale-listen.conf, regenerated at every sshd start), so it is
# not reachable from the LAN or the public internet.
Port 2222

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers phil
