# Never power the machine off: a shutdown request becomes a restart.
#
# systemd-poweroff.service still runs the normal shutdown sequence (services
# stopped, file systems unmounted); its SuccessAction is what actually cuts
# the power, so redirecting the action to reboot-force makes the machine come
# back up instead of going down. With plasmalogin autologin configured, the
# session logs itself back in after the restart.
#
# Revert: rm -r /etc/systemd/system/systemd-poweroff.service.d && systemctl daemon-reload
[Unit]
SuccessAction=reboot-force
