# Keep the Bluetooth controller (MediaTek 0489:e0f5, Wi-Fi and Bluetooth share
# the one radio) out of USB runtime autosuspend.
#
# btusb enables runtime autosuspend on this controller with a 2 second delay.
# While an A2DP stream is running the controller is never idle, so the USB stack
# keeps suspending and resuming it; the HCI queue stalls and the whole machine
# hitches every couple of seconds. The kernel log shows the damage as
# "Unexpected start frame (len 676)" and "ACL packet for unknown connection
# handle" — 676 bytes is aptX HD's ACL frame size, so the high-bitrate codec is
# the first thing to suffer.
#
# The udev rule in /etc/udev/rules.d pins power/control to "on" at runtime; this
# makes sure the driver never enables autosuspend in the first place, before
# udev has had a chance to run.
options btusb enable_autosuspend=0
