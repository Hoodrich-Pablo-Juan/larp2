# Lid-close must not suspend this machine.
#
# Rationale: this laptop doubles as a headless game-streaming host (Sunshine +
# a persistent HEADLESS monitor). Closing the lid is how it is parked while
# streaming, so a suspend would kill the stream and the SSH/tailnet session
# with it.
#
# All three lid keys are set, because logind picks between them at runtime:
#
#   HandleLidSwitchDocked=        when docked, or when an external display
#                                 is connected (this is checked FIRST)
#   HandleLidSwitchExternalPower= when on AC power  <-- the usual case here
#   HandleLidSwitch=              otherwise, i.e. on battery
#
# On this box the laptop normally sits on AC (AC0 online=1), so
# HandleLidSwitchExternalPower is the key that actually applies. Setting
# only HandleLidSwitch would have left the machine suspending on lid close.
#
# IdleAction=ignore: never suspend on idle either.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
