general {
    after_sleep_cmd = ~/.local/bin/sunshine-after-sleep.sh
}

# Idle blanks the LAPTOP PANEL ONLY.
#
# The timeout used to call hl.dsp.dpms({ action = "disable" }) with no monitor,
# which darkens every output — including the external monitor you are working
# on. Naming eDP-1 keeps the ultrawide lit no matter how long the machine sits
# untouched, and costs nothing when the panel is already dark because it is
# docked (see scripts/panel.sh).
listener {
    timeout = 90
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable", monitor = "eDP-1" })'

    # Resume re-applies the docked policy rather than blindly enabling eDP-1:
    # re-enabling it unconditionally would light the panel back up on the first
    # keypress while docked, undoing the whole point.
    on-resume = ~/.config/hypr/scripts/panel.sh sync
}
